<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bird Poultry - Coming Soon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <img src="/api/placeholder/150/150" alt="Big Bird Poultry Logo" class="logo">
            <h1>Welcome to Big Bird Poultry</h1>
            <div class="divider"></div>
            <h2>www.bigbirdpoultry.co.uk</h2>
            <div class="construction">
                <div class="icon-container">
                    <div class="construction-icon"></div>
                </div>
                <h3>Website Under Construction</h3>
                <p>We're working hard to bring you our new website. Please check back soon!</p>
            </div>
            <div class="contact">
                <p>For inquiries, please contact us at:</p>
                <p class="email">info@bigbirdpoultry.co.uk</p>
            </div>
            <div class="countdown">
                <p>Launching in:</p>
                <div id="timer">
                    <div class="time-section">
                        <span id="days">00</span>
                        <p>Days</p>
                    </div>
                    <div class="time-section">
                        <span id="hours">00</span>
                        <p>Hours</p>
                    </div>
                    <div class="time-section">
                        <span id="minutes">00</span>
                        <p>Minutes</p>
                    </div>
                    <div class="time-section">
                        <span id="seconds">00</span>
                        <p>Seconds</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
